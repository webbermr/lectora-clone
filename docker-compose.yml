# Containers, image and volumes are all named scorm-editor, whatever the folder is called.
name: scorm-editor

services:
  scorm-editor:
    build: .
    image: scorm-editor:latest
    # Plain HTTP, for this computer only (browsers allow it on localhost).
    # Other computers use the HTTPS service below.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Optional: an Anthropic API key for SCORM, the AI assistant. Put ANTHROPIC_API_KEY=… in the .env
      # file next to this one. Without it, people can enter their own key in SCORM's settings.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # HTTPS for other people on your network:
  #   SITE_ADDRESS=192.168.1.50 docker compose --profile https up -d
  # (or put SITE_ADDRESS=… and COMPOSE_PROFILES=https in a .env file next to this one,
  # so updates keep them)
  https:
    image: caddy:2-alpine
    profiles: ["https"]
    depends_on:
      - scorm-editor
    ports:
      - "443:443"
      - "80:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      SITE_NAME: ${SITE_NAME:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Keeps Caddy's certificate authority, so computers only have to trust it once.
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
